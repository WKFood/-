<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านอาหารโรงเรียน</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif, Tahoma;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            color: #e63946;
            margin-bottom: 8px;
        }
        .search-container {
            max-width: 500px;
            margin: 0 auto 25px auto;
        }
        .search-container input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .search-container input:focus {
            border-color: #e63946;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #eee;
        }
        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .shop-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: #1d3557;
            margin-bottom: 6px;
        }
        .shop-location {
            font-size: 0.85rem;
            color: #e63946;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .price-tag {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 10px;
            align-self: flex-start;
        }
        .btn-detail {
            margin-top: auto;
            padding: 8px 12px;
            background-color: #e63946;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
        }

        /* Modal (หน้าต่างป๊อปอัพเมื่อกดเข้าดู) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background-color: white;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        .modal-content img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .modal-body {
            padding: 20px;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            font-size: 20px;
            width: 35px; height: 35px;
            border-radius: 50%;
            cursor: pointer;
        }
        .menu-modal-list {
            margin-top: 15px;
            border-top: 2px solid #f4f6f9;
            padding-top: 10px;
        }
        .menu-modal-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
            font-size: 0.95rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h1>ศูนย์อาหารโรงเรียน</h1>
        <p>รายชื่อร้านค้าและรายการอาหารทั้งหมด 14 ร้าน (กดที่ร้านเพื่อดูเมนูรายละเอียด)</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="ค้นหาร้านค้า หรือ อาหาร..." onkeyup="filterShops()">
    </div>

    <div class="grid-container" id="shopGrid"></div>

    <!-- หน้าต่าง Pop-up ดูรายละเอียด -->
    <div class="modal" id="shopModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <img id="modalImg" src="" alt="">
            <div class="modal-body">
                <h2 id="modalTitle"></h2>
                <p id="modalLocation" style="color: #e63946; font-weight: bold; margin: 5px 0;"></p>
                <div id="modalPrice" class="price-tag"></div>
                <h3 style="margin-top: 15px; font-size: 1rem; color: #1d3557;">รายการเมนูแนะนำ & ราคา:</h3>
                <div class="menu-modal-list" id="modalMenuList"></div>
            </div>
        </div>
    </div>

                menus: [
                    { name: "ข้าวมันไก่ต้ม", price: "25 - 35.-" },

                    { name: "ข้าวมันไก่ป๊อป", price: "25 - 35.-" },
                    { name: "ข้าวหมูทอด", price: "25 - 35.-" }
                ]

                    { name: "ภาชนะ: เลือกใส่ถ้วย / ขนมปัง", price: "ฟรีท็อปปิ้ง" }
                ]

            {
                id: 4,
                name: "ร้านเครป โตเกียว ขวัญเมือง",
                location: "📍 ล็อกที่ 4",
                img: "shop4.jpg",
                price: "ราคา 20 - 30 บาท",
                menus: [
                    { name: "เครป / โตเกียว ไส้กรอก", price: "20 - 30.-" },
                    { name: "เครป / โตเกียว ไส้หวาน", price: "20 - 30.-" },
                    { name: "เครป / โตเกียว ไส้ช็อกโกแลต", price: "20 - 30.-" }
                ]
            },
            {
                id: 5,

                location: "📍 ล็อกที่ 5",
                img: "shop5.jpg",
                price: "ราคา 25 - 30 บาท",
                menus: [
                    { name: "ข้าวราดแกงกะเพรา", price: "25 - 30.-" },
                    { name: "ข้าวราดลาบ", price: "25 - 30.-" },
                    { name: "ข้าวราดไก่แซ่บ", price: "25 - 30.-" },
                    { name: "ท็อปปิ้งเพิ่ม: ไข่ดาว / ทอดมันข้าวโพด", price: "ตามป้าย" }
                ]
            },
            {
                id: 6,
                name: "ร้านน้ำผลไม้ปั่น นิสรา",
                location: "📍 ล็อกที่ 6",
                img: "shop6.jpg",
                price: "ราคา 15 - 25 บาท",
                menus: [
                    { name: "น้ำลำไย", price: "15 - 25.-" },
                    { name: "น้ำแตงโมปั่น", price: "15 - 25.-" },
                    { name: "น้ำสตรอว์เบอร์รีปั่น", price: "15 - 25.-" },
                    { name: "น้ำแอปเปิลปั่น", price: "15 - 25.-" },
                    { name: "น้ำองุ่นปั่น", price: "15 - 25.-" }
                ]
            },
            {
                id: 7,
                name: "ร้านก๋วยเตี๋ยว มนตรี",
                location: "📍 ล็อกที่ 7",
                img: "shop7.jpg",
                price: "ราคา 25 - 30 บาท",
                menus: [
                    { name: "ก๋วยเตี๋ยวหมู / เย็นตาโฟ / ต้มยำ", price: "25 - 30.-" },
                    { name: "ตัวเลือกเส้น: เส้นเล็ก, เส้นใหญ่, มาม่า, หมี่หยก, เกี๊ยว", price: "-" }
                ]
            },
            {
                id: 8,
                name: "ร้านก๋วยเตี๋ยว อังสุมาลิน",
                location: "📍 ล็อกที่ 8",
                img: "shop8.jpg",
                price: "ราคา 25 - 30 บาท",
                menus: [
                    { name: "ก๋วยเตี๋ยวหมู / เย็นตาโฟ / ต้มยำ", price: "25 - 30.-" },
                    { name: "ตัวเลือกเส้น: เส้นเล็ก, เส้นใหญ่, มาม่า, หมี่หยก, เกี๊ยว", price: "-" }
                ]
            },
            {
                id: 9,
                name: "ร้านผลไม้สด ศิรินภา",
                location: "📍 ล็อกที่ 9",
                img: "shop9.jpg",
                price: "ราคา 10 บาท",
                menus: [
                    { name: "แตงโม", price: "10.-" },

                    { name: "ฝรั่ง", price: "10.-" },
                    { name: "แอปเปิล", price: "10.-" }
                ]
            },
            {
                id: 10,
                name: "ร้านน้ำแข็งเกล็ดหิมะ วิภาพันธ์",

                price: "ราคา 10 - 15 บาท",
                menus: [

                    { name: "ท็อปปิ้ง: เฉาก๊วย, ขนมปัง, วุ้นมะพร้าว, ซีเรียล", price: "เลือกใส่ได้" }
                ]
            },
            {
                id: 11,
                name: "ขนมจีบ ซาลาเปา",
                location: "📍 ล็อกที่ 11",
                img: "shop11.jpg",
                price: "ราคา 2 - 5 บาท",
                menus: [
                    { name: "ขนมจีบ (ลูกละ)", price: "2.-" },
                    { name: "ซาลาเปาไส้หมู (ลูกละ)", price: "5.-" },
                    { name: "ซาลาเปาไส้ครีม (ลูกละ)", price: "5.-" },
                    { name: "ซาลาเปาไส้ถั่วแดง (ลูกละ)", price: "5.-" }
                ]
            },
            {
                id: 12,
                name: "ร้านข้าวราดแกง (2)",
                location: "📍 ล็อกที่ 12",
                img: "shop12.jpg",
                price: "ราคา 25 - 30 บาท",
                menus: [
                    { name: "ข้าวราดแกงกะเพรา", price: "25 - 30.-" },
                    { name: "ข้าวราดลาบ", price: "25 - 30.-" },
                    { name: "ข้าวราดไก่แซ่บ", price: "25 - 30.-" },
                    { name: "ท็อปปิ้งเพิ่ม: ไข่ดาว / ทอดมันข้าวโพด", price: "ตามป้าย" }
                ]
            },
            {
                id: 13,
                name: "ร้านลูกชิ้นนึ่ง",
                location: "📍 ล็อกที่ 13",
                img: "shop13.jpg",
                price: "ราคา 5 บาท/ไม้",
                menus: [
                    { name: "ลูกชิ้นนึ่ง (ไม้ละ)", price: "5.-" }
                ]
            },
            {
                id: 14,
                name: "ร้านเบเกอรี",
                location: "📍 ล็อกที่ 14",
                img: "shop14.jpg",
                price: "ราคา 10 บาท",
                menus: [
                    { name: "คุกกี้ / บราวนี่", price: "10.-" },
                    { name: "เครปเย็น", price: "10.-" },
                    { name: "พุดดิ้ง / เอแคลร์", price: "10.-" },
                    { name: "ขนมปังต่างๆ", price: "10.-" }
                ]
            }
        ];

        // ฟังก์ชันย่อยคำ คลีนสระลอย นิคหิต และวรรณยุกต์ทั้งหมด
        function normalizeThai(text) {
            if (!text) return '';
            return text
                .normalize('NFC')
                .replace(/ำ/g, 'า')
                .replace(/[\u0e31\u0e34-\u0e3a\u0e47-\u0e4e]/g, '')
                .toLowerCase()
                .trim();
        }

        function renderShops(data) {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            
            if (data.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888; font-size: 1.1rem; padding: 40px 0;">❌ ไม่พบร้านค้าหรือเมนูที่ค้นหา</p>';
                return;
            }

            data.forEach(shop => {
                const card = `
                    <div class="card" onclick="openModal(${shop.id})">
                        <img src="${shop.img}" alt="${shop.name}" onerror="this.src='https://via.placeholder.com/300x180?text=ไม่มีรูปภาพ'">
                        <div class="card-content">
                            <div class="shop-title">${shop.name}</div>
                            <div class="shop-location">${shop.location}</div>
                            <div class="price-tag">🏷️ ${shop.price}</div>
                            <div class="btn-detail">คลิกเพื่อดูเมนูรายละเอียด ➔</div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function openModal(id) {
            const shop = shops.find(s => s.id === id);
            if(!shop) return;

            document.getElementById('modalImg').src = shop.img;
            document.getElementById('modalTitle').innerText = shop.name;
            document.getElementById('modalLocation').innerText = shop.location;
            document.getElementById('modalPrice').innerText = '🏷️ ' + shop.price;

            let menuHTML = shop.menus.map(m => `
                <div class="menu-modal-item">
                    <span>• ${m.name}</span>
                    <b style="color:#e63946;">${m.price}</b>
                </div>
            `).join('');

            document.getElementById('modalMenuList').innerHTML = menuHTML;
            document.getElementById('shopModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('shopModal').style.display = 'none';
        }

        function filterShops() {
            const rawQuery = document.getElementById('searchInput').value;
            const query = normalizeThai(rawQuery);
            
            if (query === '') {
                renderShops(shops);
                return;
            }

            const filtered = shops.filter(shop => {
                const shopNameClean = normalizeThai(shop.name);
                const matchName = shopNameClean.includes(query);
                const matchMenu = shop.menus.some(m => normalizeThai(m.name).includes(query));
                return matchName || matchMenu;
            });
            
            renderShops(filtered);
        }

        renderShops(shops);
    </script>
</body>
</html>
